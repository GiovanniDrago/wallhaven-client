name: 'Test'
on:
  push:
  pull_request:
permissions:
  contents: 'read'
jobs:
  test:
    name: 'Unit tests and debug APK'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up JDK'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 'Run unit tests and build the debug APK'
        run: './gradlew test assembleDebug'

      - name: 'Upload debug APK'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'wallhaven-client-debug-${{ github.run_number }}'
          path: 'app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 30
