name: 'Test'
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: 'read'
jobs:
  test:
    name: 'Unit tests and debug APK'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up JDK'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 'Run unit tests, build the debug APK and the coverage report'
        run: './gradlew test assembleDebug createDebugUnitTestCoverageReport'

      - name: 'Upload coverage report'
        if: 'always()'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'wallhaven-client-coverage-${{ github.run_number }}'
          path: |
            app/build/reports/coverage/
            app/build/outputs/unit_test_code_coverage/
          if-no-files-found: 'warn'
          retention-days: 30

      - name: 'Upload debug APK'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'wallhaven-client-debug-${{ github.run_number }}'
          path: 'app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 30
